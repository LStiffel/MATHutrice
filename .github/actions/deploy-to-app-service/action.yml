# One deploy, whichever the environment: write that environment's settings to
# its App Service app, have the app run the given image, and wait until that
# image answers. Staging and production both deploy through here, so production
# is deployed exactly the way staging was, only with its own app and secrets.
#
# The caller is already logged in to Azure (azure/login), as the GitHub
# Environment it runs in.
name: Deploy to App Service
description: Run one image on one environment's App Service app, with that environment's settings.

inputs:
  image:
    description: The image to run, tagged with the commit it was built from.
    required: true
  resource-group:
    description: The resource group holding the app.
    required: true
  app-name:
    description: The environment's App Service app.
    required: true
  dev-login-key:
    description: The environment's own DEV_LOGIN_KEY.
    required: true
  session-secret:
    description: The environment's own SESSION_SECRET.
    required: true
  llm-api-key:
    description: LLM_API_KEY, the Mistral key.
    required: true

runs:
  using: composite
  steps:
    # Written at every deploy, so the GitHub Environment stays the one place a
    # setting is changed. --output none: the command would otherwise print
    # every setting back, secrets included.
    #
    # - WEBSITES_PORT: uvicorn listens on 8000, not on the 80 App Service expects.
    # - WEBSITES_ENABLE_APP_SERVICE_STORAGE=false and DATABASE_URL: the SQLite
    #   file stays on the container's own disk, in /app. App Service's lasting
    #   storage, /home, is a network share on which SQLite cannot take its
    #   locks. The database is created and seeded again at every start.
    # - AUTH_MODE=dev: both environments hold generated data and simulated
    #   users, who sign in through the dev sign-in, guarded by the environment's
    #   own DEV_LOGIN_KEY, its cookie signed by its own SESSION_SECRET.
    # - LLM_*: Mistral, called directly.
    - name: Write this environment's settings
      shell: bash
      env:
        RESOURCE_GROUP: ${{ inputs.resource-group }}
        APP_NAME: ${{ inputs.app-name }}
        DEV_LOGIN_KEY: ${{ inputs.dev-login-key }}
        SESSION_SECRET: ${{ inputs.session-secret }}
        LLM_API_KEY: ${{ inputs.llm-api-key }}
      run: |
        az webapp config appsettings set \
          --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --output none \
          --settings \
            WEBSITES_PORT=8000 \
            WEBSITES_ENABLE_APP_SERVICE_STORAGE=false \
            AUTH_MODE=dev \
            DATABASE_URL=sqlite:///./mathutrice.db \
            LLM_BASE_URL=https://api.mistral.ai/v1 \
            LLM_MODEL=ministral-14b-latest \
            "DEV_LOGIN_KEY=$DEV_LOGIN_KEY" \
            "SESSION_SECRET=$SESSION_SECRET" \
            "LLM_API_KEY=$LLM_API_KEY"

    # The image is public on GHCR, so the app pulls it without credentials.
    - name: Run the image
      shell: bash
      env:
        RESOURCE_GROUP: ${{ inputs.resource-group }}
        APP_NAME: ${{ inputs.app-name }}
        IMAGE: ${{ inputs.image }}
      run: |
        az webapp config container set \
          --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --output none \
          --container-image-name "$IMAGE"
        running=$(az webapp config show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --query linuxFxVersion --output tsv)
        if [ "$running" != "DOCKER|$IMAGE" ]; then
          echo "$APP_NAME is set to $running, not $IMAGE" >&2
          exit 1
        fi
        echo "$APP_NAME now runs $IMAGE"

    # App Service keeps serving the previous container until the new one has
    # started, or failed to, so a 200 alone may come from the previous image.
    # Wait until the image just set answers: the app sends the commit it was
    # built from in its X-Revision header, and the image's tag is that commit.
    # A container that does not start fails the run, even while the previous
    # one still answers.
    #
    # The limit, 700 s, is the Worked Example's: twice the slowest start it
    # measured on the same kind of B1 plan (350 s, mostly pulling the image).
    # Our own runs' "answers 200 … s after" lines are the number to revise it by.
    - name: Wait until the new image answers
      shell: bash
      env:
        APP_NAME: ${{ inputs.app-name }}
        IMAGE: ${{ inputs.image }}
      run: |
        url="https://$APP_NAME.azurewebsites.net/dev/login"
        revision="${IMAGE##*:}"
        limit=700
        start=$(date +%s)
        attempt=0
        while true; do
          attempt=$((attempt + 1))
          answer=$(curl -s -o /dev/null -w '%{http_code} %header{x-revision}' --max-time 30 "$url" || true)
          elapsed=$(( $(date +%s) - start ))
          if [ "$answer" = "200 $revision" ]; then
            echo "$url answers 200 from $revision, ${elapsed} s after the image was set"
            exit 0
          fi
          echo "Attempt $attempt, ${elapsed} s: $url answered ${answer:-nothing}, waiting for 200 $revision"
          if [ "$elapsed" -ge "$limit" ]; then
            echo "$url did not answer 200 from $revision within $limit s" >&2
            exit 1
          fi
          sleep 15
        done
